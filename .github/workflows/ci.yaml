name: CI

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**' # don't run (again) when on these special branches created during merge groups; the `on: merge_group` already triggers it.
  merge_group:
  pull_request:

env:
  PYTHONUNBUFFERED: True
  PRE_COMMIT_HOME: ${{ github.workspace }}/.precommit_cache

permissions:
    id-token: write
    contents: write # needed for mutex

jobs:
  get-values:
    uses: ./.github/workflows/get-values.yaml
    permissions:
      contents: write # needed updating dependabot branches

  check-skip-duplicate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # needed to check if PR exists for current branch
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - id: check
        uses: ./.github/actions/check-skip-duplicates

  lint:
    needs:
      - get-values
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    name: Pre-commit
    uses: ./.github/workflows/pre-commit.yaml
    permissions:
      contents: write # needed for mutex
      id-token: write # needed to assume OIDC roles (e.g. for downloading from CodeArtifact)
    with:
      python-version: 3.13.2

  build-app-frontend:
    needs:
      - check-skip-duplicate
      - lint
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install latest versions of node packages
        uses: ./.github/actions/install_deps
        with:
          node-version: 24.7.0
          skip-installing-ssm-plugin-manager: true

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: arn:aws:iam::609350892236:role/InfraPreview--rytermedia-com
          aws-region: "us-east-1"

      - name: Download large media files from S3
        run: |
          aws s3 sync s3://manual-artifacts--rytermedia-com--prod-adf4c0c/rytermedia_app/public/s3 ./rytermedia_app/public/s3


      - name: Build frontend
        run: pnpm --dir=rytermedia_app generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: app-frontend-static-assets
          path: rytermedia_app/.output/public/**/*
          if-no-files-found: error




  pulumi-prod:
    uses: ./.github/workflows/pulumi-aws.yml
    needs:
      - build-app-frontend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main')
    permissions:
      id-token: write # needed to assume OIDC roles (e.g. for downloading from CodeArtifact)
      contents: write # needed for mutex
      pull-requests: write # needed to potentially post the preview on the PR as a comment
    with:
      AWS_REGION: us-east-1
      PULUMI_STACK_NAME: prod
      PYTHON_VERSION: 3.13.2
      PROJECT_DIR: ./infrastructure
      DEPLOY_SCRIPT_MODULE_NAME: infrastructure
      PULUMI_PREVIEW: true
      PREVIEW_ROLE_NAME: InfraPreview--rytermedia-com
      PULUMI_UP: ${{ github.ref == 'refs/heads/main' }}
      PULUMI_UP_ROLE_NAME: InfraDeploy--rytermedia-com
      AWS_ACCOUNT_ID: "609350892236"
      DOWNLOAD_ARTIFACT_NAME: app-frontend-static-assets
      DOWNLOAD_ARTIFACT_PATH: rytermedia_app/.output/public/

  workflow-summary:
    runs-on: ubuntu-24.04
    permissions:
      statuses: write # needed for updating status on Dependabot PRs
    needs:
      - get-values
      - build-app-frontend
      - pulumi-prod
      - check-skip-duplicate
    if: always()
    steps:
      - name: fail if prior job failure
        run: |
          success_pattern="^(skipped|success)$" # these are the possibilities: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context

          if [[ ! "${{ needs.get-values.result }}" =~ $success_pattern ]] ||
            [[ ! "${{ needs.build-app-frontend.result }}" =~ $success_pattern ]] ||
            [[ ! "${{ needs.pulumi-prod.result }}" =~ $success_pattern ]]; then
            echo "❌ One or more jobs did not finish with skipped or success"
            exit 1
          fi
          echo "✅ All jobs finished with skipped or success"

      - name: Mark the required-check as succeeded so the PR can be merged
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST -H "Accept: application/vnd.github.v3+json" \
            "${{ github.event.pull_request.statuses_url }}" \
            -f state=success -f context="required-check" -f description="✅ All required checks passed in the job triggered by pull_request" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark updated Dependabot commit of devcontainer hash as succeeded
        if: needs.get-values.outputs.dependabot-commit-created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST -H "Accept: application/vnd.github.v3+json" \
            "/repos/${{ github.repository }}/statuses/${{ needs.get-values.outputs.new-dependabot-sha }}" \
            -f state=success -f context="required-check" -f description="Initial CI run passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
